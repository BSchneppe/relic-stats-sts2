name: Release
on:
  push:
    tags: ['v*']
env:
  # The DLL is compiled against the newest supported game version and resolves its patch targets
  # at runtime (Core/PatchTarget.cs), so a single artifact covers every version in SUPPORTED_REFS.
  BUILD_REF_ASSEMBLIES: '0.110.0-beta-eecc8c4d'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore dependencies
        run: dotnet restore -p:RefAssembliesVersion=${{ env.BUILD_REF_ASSEMBLIES }}
      - name: Build
        run: dotnet build -c Release --no-restore -p:RefAssembliesVersion=${{ env.BUILD_REF_ASSEMBLIES }}

      # Refuse to ship a build whose patch targets have gone stale on any supported version:
      # a renamed hook still compiles and then silently stops tracking its relic in game.
      - name: Audit Harmony patch targets on every supported version
        run: |
          for ref in 0.107.1 0.110.0-beta-eecc8c4d; do
            echo "== $ref =="
            dotnet restore -p:RefAssembliesVersion="$ref"
            dotnet run --project tools/PatchAudit -- . \
              ~/.nuget/packages/bschneppe.sts2.referenceassemblies/"$ref"/ref/net9.0/sts2.dll \
              --allow-missing RunManager.InitializeNewRun \
              --allow-missing NRunHistory.DisplayRun
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .godot/mono/temp/bin/Release/RelicStats.dll

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: artifacts
      - name: Package
        run: |
          mkdir -p release/RelicStats
          cp artifacts/RelicStats.dll release/RelicStats/
          cp RelicStats.json release/RelicStats/
          cd release
          zip -r ../RelicStats-v${{ steps.version.outputs.version }}.zip RelicStats
      - name: Restore dependencies
        run: dotnet restore -p:RefAssembliesVersion=${{ env.BUILD_REF_ASSEMBLIES }}
      - name: Build for NuGet
        run: dotnet build -c Release --no-restore -p:RefAssembliesVersion=${{ env.BUILD_REF_ASSEMBLIES }}
      - name: Pack NuGet
        run: dotnet pack -c Release -o ./nupkg -p:Version=${{ steps.version.outputs.version }} --no-build
      - name: Push to nuget.org
        run: dotnet nuget push ./nupkg/*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RelicStats-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
